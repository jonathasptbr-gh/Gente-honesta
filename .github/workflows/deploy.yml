name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guardrail (NÃO é build — o site segue estático): falha o deploy se algum
      # ícone referenciado no código não tiver <symbol> no sprite (renderizaria em
      # branco). O checker só usa `fs`, então roda sem `npm install`.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar ícones do sprite
        run: node scripts/check-icons.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
